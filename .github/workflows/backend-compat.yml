name: backend compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Always triggers (no path filter on the workflow itself) so the gate
  # checks below post on every PR — GitHub never satisfies a required
  # status check that a path-filtered trigger simply never runs. This job
  # decides whether the expensive legs actually need to do anything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - "backends/**"
              - "internal/backend/**"
              - "go.mod"
              - "go.sum"
              - ".github/workflows/backend-compat.yml"

  jj:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    uses: hugoh/go-tools/.github/workflows/go-tool-compat.yml@1060072de74a95c0005f5d80e028e89e400525e1 # v1.34.2
    permissions:
      contents: read
    with:
      tool: jj
      test-target: "./backends/jj/..."

  # Stable check name for branch protection: the reusable workflow's own
  # "jj / versions" and "jj / gate" checks only get created once its jobs
  # actually run, so a skipped `jj` job (unrelated paths) posts neither —
  # leaving branch protection waiting forever. This wrapper always runs and
  # passes trivially when `jj` was skipped, so it's what's pinned as the
  # required context instead.
  jj-gate:
    if: always()
    needs: [changes, jj]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: jj
          jobs: ${{ toJSON(needs) }}

  git:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-24.04]
    steps:
      - uses: hugoh/gh-workflows/setup@1990006622d3176e00fbf0d3d0b40723cfe8dbeb # v1.40.28
      - name: git integration tests
        env:
          REQUIRE_INTEGRATION: "1"
        run: |
          set -euo pipefail
          git --version
          gotestsum -- -race -shuffle=on ./backends/git/...

  # Stable check name for branch protection: the `git` matrix leg names carry
  # the runner label, so they can't be pinned as required contexts. Also
  # passes trivially when `git` was skipped for unrelated paths.
  git-gate:
    if: always()
    needs: [changes, git]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: git
          jobs: ${{ toJSON(needs) }}
