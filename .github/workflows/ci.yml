---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        type: choice
        description: "Version bump type"
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

jobs:
  hk:
    uses: hugoh/go-tools/.github/workflows/go-hk.yml@efb529737c7aa6692f07a9564f4267f2ecf5244a
    permissions:
      contents: read

  goci:
    uses: hugoh/go-tools/.github/workflows/go-ci.yml@efb529737c7aa6692f07a9564f4267f2ecf5244a
    permissions:
      contents: read

  pages:
    needs: [hk, goci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: hugoh/go-tools/.github/workflows/go-pages.yml@efb529737c7aa6692f07a9564f4267f2ecf5244a
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      pages_dir: "site"

  release:
    needs: [hk, goci]
    uses: hugoh/go-tools/.github/workflows/go-release.yml@efb529737c7aa6692f07a9564f4267f2ecf5244a
    permissions:
      contents: write
    with:
      bump_type: ${{ inputs.bump_type || 'auto' }}
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      tap_github_token: ${{ secrets.TAP_GITHUB_TOKEN }}
