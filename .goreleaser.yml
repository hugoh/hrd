version: 2

before:
  hooks:
    - go run ./cmd/genman

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: "386"
    flags:
      - -trimpath
      - -mod=readonly
    ldflags:
      - -s -w
      - -X github.com/hugoh/hrd/cmd.version={{.Version}}

nfpms:
  - maintainer: "Hugo Haas <hugoh@hugoh.net>"
    description: "Multi-repo manager for git and jj with parallel execution and live status"
    homepage: "https://github.com/hugoh/hrd"
    license: "MIT"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: man/*.1
        dst: /usr/share/man/man1

brews:
  # DEPRECATED but intentional: homebrew_casks requires Gatekeeper-signed
  # binaries or macOS flags the cask as malware. brews (Formula) has no
  # such requirement. See https://goreleaser.com/deprecations/#brews
  - name: hrd
    repository:
      owner: hugoh
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    description: "Multi-repo manager for git and jj with parallel execution and live status"
    homepage: "https://github.com/hugoh/hrd"
changelog:
  use: git
  sort: asc
  groups:
    - title: "⚠️ Breaking Changes"
      regexp: '^.*?(\w+)(\(.+\))??!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs?(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Dependency Updates
      regexp: '^.*?(feat|fix|chore)\(deps\).*:.+$'
      order: 900
    - title: Others
      order: 999
  filters:
    exclude:
      - "^chore\\(release\\): prepare for"
      - "^chore\\(deps"
      - "Merge pull request"
      - "Merge branch"

checksum:

snapshot:
