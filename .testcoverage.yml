profile: cover.out

threshold:
  total: 90

override:
  - path: backends/
    threshold: 100

exclude:
  paths:
    - main\.go$ # Program entry point
    - cmd/genreadme/
    - cmd/latestminors/ # thin CLI wrapper; logic covered in internal/versionpick
    - internal/backend/backendtest/ # shared test helpers, exercised only from other packages' tests
