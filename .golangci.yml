version: "2"
linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - godoclint
    - gomodguard
    - ireturn
    - noinlineerr
    - paralleltest
    - testpackage
    - varnamelen
    - wsl
  settings:
    revive:
      rules:
        - name: redefines-builtin-id
          disabled: true
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - err113
          - noctx
          - varnamelen
          - goconst
          - gosec
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
    - golines
