# DO NOT EDIT — managed by hugoh/go-tools via copier.
version: "2"
linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - gomodguard
    - noinlineerr
    - paralleltest
    - testpackage
    - godoclint
    - ireturn
    - varnamelen
    - wsl
  settings:
    revive:
      rules:
        - name: redefines-builtin-id
          disabled: true
        - name: exported
          disabled: true
        - name: unused-parameter
        - name: unused-receiver
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - err113
          - varnamelen
          - noctx
          - goconst
          - gosec
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
    - golines
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
