# Changes here will be overwritten by Copier; NEVER EDIT MANUALLY
_commit: v1.15.0
_src_path: https://github.com/hugoh/go-tools.git
cog_omit_types: []
coverage_total: 90
gen_check_cmd: git diff --exit-code README.md
gen_cmd:
- go generate ./...
- rumdl check --fix README.md
gen_outputs:
- README.md
gen_sources:
- README.md.tpl
- cmd/**/*.go
golangci_extra_disable:
- depguard
- exhaustruct
- godoclint
- ireturn
- testpackage
- varnamelen
golangci_extra_exclusions: []
golangci_settings: "revive:\n  rules:\n    - name: redefines-builtin-id\n      disabled:\
    \ true\n    - name: exported\n      disabled: true\n    - name: unused-parameter\n\
    \    - name: unused-receiver\n"
golangci_test_exclude_linters:
- err113
- noctx
- varnamelen
- goconst
- gosec
goreleaser_before_hooks:
- go run ./cmd/genman
goreleaser_version_pkg: github.com/hugoh/hrd/cmd
has_executable: true
has_fuzz: false
has_gen: true
has_goreleaser: true
has_homebrew_cask: true
has_pages: true
has_test_int: false
nfpm_extra_contents:
-   dst: /usr/share/man/man1
    src: man/*.1
pages_dir: site
pages_gen_cmd:
- go run ./cmd/genweb
project_description: Multi-repo manager for git and jj with parallel execution and
    live status
project_name: hrd
testcoverage_excludes:
- 'main\.go$ # Program entry point'
- cmd/genreadme/
- 'internal/backend/backendtest/ # shared test helpers, exercised only from other
    packages'' tests'
testcoverage_overrides:
-   path: backends/
    threshold: 100

