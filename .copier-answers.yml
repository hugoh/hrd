# Changes here will be overwritten by Copier; NEVER EDIT MANUALLY
_commit: v1.5.1
_src_path: gh:hugoh/go-tools
codecov_components:
-   id: backends_git
    name: backends/git
    path: backends/git/**
-   id: backends_jj
    name: backends/jj
    path: backends/jj/**
codecov_ignore:
- main.go
- cmd/genreadme/**
codecov_style: full
codecov_target: 80%
cog_omit_types: []
coverage_total: 90
dev_watch: false
gen_check_cmd: git diff --exit-code README.md
gen_cmd:
- go generate ./...
- dprint fmt README.md
gen_outputs:
- README.md
gen_sources:
- README.md.tpl
- cmd/**/*.go
golangci_extra_disable:
- depguard
- exhaustruct
- godoclint
- ireturn
- testpackage
- varnamelen
golangci_extra_exclusions: []
golangci_settings: "revive:\n  rules:\n    - name: redefines-builtin-id\n      disabled:\
    \ true\n    - name: exported\n      disabled: true\n    - name: unused-parameter\n\
    \    - name: unused-receiver\n"
golangci_test_exclude_linters:
- err113
- noctx
- varnamelen
- goconst
- gosec
goreleaser_before_hooks:
- go run ./cmd/genman
goreleaser_version_pkg: github.com/hugoh/hrd/cmd
has_fuzz: false
has_gen: true
has_goreleaser: true
has_homebrew_cask: true
has_test_int: false
hk_has_golangci_step: false
hk_has_goreleaser_step: true
hk_prepush_with_go_ci: true
nfpm_extra_contents:
-   dst: /usr/share/man/man1
    src: man/*.1
project_description: Multi-repo manager for git and jj with parallel execution and
    live status
project_name: hrd
testcoverage_excludes:
- 'main\.go$ # Program entry point'
- cmd/genreadme/
- 'internal/backend/backendtest/ # shared test helpers, exercised only from other
    packages'' tests'
testcoverage_overrides:
-   path: backends/
    threshold: 100

