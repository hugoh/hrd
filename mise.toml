[tools]
go = "1.26.3"
"go:github.com/vladopajic/go-test-coverage/v2" = "2.18.8"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.3.0"
golangci-lint = "2.12.2"
goreleaser = "2.15.4"
cocogitto = "7.0.0"
gotestsum = "1.13.0"
hk = "1.45.0"
rumdl = "0.1.94"
zizmor = "1.25.2"
dprint = "0.54.0"
ghalint = "1.5.6"
gitleaks = "8.30.1"
actionlint = "1.7.12"
jj = "0.41.0"
"npm:jscpd" = "4.2.3"
"go:golang.org/x/tools/cmd/deadcode" = "0.45.0"

[env]
COVEROUT = "cover.out"
HK_PKL_BACKEND = "pklr"

[tasks.lint]
description = "Lint code, check dead code"
sources = ["go.mod", "**/*.go"]
usage = 'flag "--fix" help="Automatically fix issues"'
run = [
  "go mod tidy -diff",
  "deadcode -test ./... 2>&1 | grep . && { echo 'dead code found'; exit 1; } || true",
  "golangci-lint run ${usage_fix:+--fix} ./...",
]

[tasks.fix]
description = "Lint and fix code"
depends = [{ task = "lint", args = ["--fix"] }]

[tasks.test]
description = "Run tests with coverage"
sources = ["**/*.go"]
run = "gotestsum -- -race -coverprofile=${COVEROUT} -covermode=atomic ./..."

[tasks.test-int]
description = "Run integration tests"
sources = ["**/*.go"]
run = "gotestsum -- -race -tags=integration ./internal/..."

[tasks.covercheck]
description = "Check test coverage"
depends = ["test"]
run = "go-test-coverage -config .testcoverage.yml"

[tasks.ci-core]
description = "Run core CI checks (test, coverage, integration)"
depends = ["test", "covercheck", "test-int"]

[tasks.ci]
description = "Run full CI pipeline (lint, tests, coverage, readme check)"
depends = ["lint", "ci-core", "readmecheck", "build"]

[tasks.full-check]
description = "Run full pre-commit validation (format, fix, core CI)"
run = [
  "mise run format",
  "mise run fix",
  "mise run ci-core",
]

[tasks.clean]
description = "Clean the project"
run = ["go clean", "rm -f ${COVEROUT}"]

[tasks.format]
description = "Format the code"
sources = [
  "**/*.go",
  "**/*.json",
  "**/*.md",
  "**/*.toml",
  "**/*.yaml",
  "**/*.yml",
]
run = ["golangci-lint fmt ./...", "dprint fmt . --excludes README.md"]

[tasks.tidy]
description = "Tidy the module"
run = "go mod tidy -v"

[tasks.build]
description = "Build application"
sources = ["**/*.go", "go.mod", "go.sum"]
run = "go build -o dist/hrd ."

[tasks.dev]
description = "Development mode"
run = "go run ."

[tasks.readme]
description = "Regenerate README.md from template"
sources = ["README.md.tmpl", "cmd/**/*.go"]
outputs = ["README.md"]
run = ["go generate ./...", "dprint fmt README.md"]

[tasks.readmecheck]
description = "Check README.md is in sync with template"
depends = ["readme"]
run = "git diff --exit-code README.md"

[tasks.depup]
description = "Upgrade dependencies"
run = ["go get -u -t ./...", "go mod tidy -v"]
